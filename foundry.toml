[profile.default]
#evm_version = "cancun"
evm_version = "prague"
ffi = true
src = "src"
out = "out"
via-ir = true
cbor_metadata = true
gas_reports = ["Router", "TheComact", "SameChainRoute", "SameChainArbiter"]
script = "script"
libs = ["node_modules"]
fs_permissions = [{ access = "read", path = "artifacts" }, { access = "read-write", path = "gas_calculations" }, { access = "read-write", path = "./script/deployments" }]
allow_paths = ["*", "/"]
gas_limit = "18446744073709551615"
memory_limit = 2147483648
optimizer_runs = 10
verbosity = 3
solc = "0.8.30"
#optimizer_runs = 100
bytecode_hash = 'none'
#extra_output_files = ["irOptimized"]
ignored_warnings_from = ["node_modules", "test"]

# NOTE: use this profile to build the actual modules, reduces code size
[profile.release]
optimizer_runs = 10000
bytecode_hash = 'none'

[profile.default.invariant]
  call_override = false # Override unsafe external calls to perform reentrancy checks
  depth = 10            # Number of calls executed in one run
  fail_on_revert = true
  runs = 50

# Speed up compilation and tests during development
[profile.lite]
  optimizer = false

[rpc_endpoints]
local = "http://localhost:8545"
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${API_KEY_ALCHEMY}"
optimism = "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
base_sepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
optimism_sepolia = "https://opt-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 140
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true

[etherscan]
arbitrum = { key = "${TENDERLY_API_KEY}", url = "https://api.tenderly.co/api/v1/account/rhinestone/project/chain-abstraction/etherscan/verify" }
optimism = { key = "${TENDERLY_API_KEY}", url = "https://api.tenderly.co/api/v1/account/rhinestone/project/chain-abstraction/etherscan/verify/network/10" }
base = { key = "${TENDERLY_API_KEY}", url = "https://api.tenderly.co/api/v1/account/rhinestone/project/chain-abstraction/etherscan/verify/network/8453" }

[lint]
lint_on_build = false
